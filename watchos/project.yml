# XcodeGen spec for a standalone watchOS 10+ SwiftUI Home Assistant remote.
# Generate on a Mac:  brew install xcodegen && xcodegen generate && open WatchRemote.xcodeproj
# Change PRODUCT_BUNDLE_IDENTIFIER (and the Keychain service in Keychain.swift)
# to something unique before you build — com.example.hawatchremote is a placeholder.
name: WatchRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WatchRemote:
    # Xcode 14+ single-target watch app: plain `application` on watchOS
    # (NOT application.watchapp2), with WKApplication/WKWatchOnly in Info.plist.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    # Base.xcconfig optionally #includes the gitignored Secrets.xcconfig (HA prefill).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatchRemote
    settings:
      base:
        PRODUCT_NAME: WatchRemote
        # Placeholder — change this to a unique id (free teams need one that isn't taken).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hawatchremote
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        # Leave empty: pick your Personal Team in Signing & Capabilities (free).
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: NO
